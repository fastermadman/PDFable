name: CI

# Lint + smoke test run on ubuntu (cheap); macOS minutes cost 10x, so macOS only builds the app
# (needs osacompile/codesign/plutil). PR-only, and superseded runs are cancelled.
# `check` is the required status check in the pr-flow ruleset.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr shellcheck
      # apt's ImageMagick is v6 (no `magick` command); Homebrew is preinstalled but not on PATH.
      - run: |
          /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - run: shellcheck -e SC1090,SC2153 pdfable.sh build.sh tests/smoke.sh tests/real.sh tests/synth.sh tests/measure.sh
      - run: tests/smoke.sh
      - run: tests/synth.sh
      # the Rust binary is what the app ships; same CLI, so the same tests run against it
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - run: BIN=rust/target/release/pdfable tests/smoke.sh
      - run: BIN=rust/target/release/pdfable tests/synth.sh

  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh

  # #31: the Rust binary on Windows and Linux. A noisy 2-page "scan" (Pillow) must come out as a smaller 2-page PDF.
  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path rust/Cargo.toml && cargo test --release --manifest-path rust/Cargo.toml
      - run: pip install pillow pypdf
      - run: |
          python - <<'PY'
          import random
          from PIL import Image, JpegImagePlugin  # noqa: F401 (registers the JPEG writer the PDF saver needs)
          random.seed(1)
          pages = [Image.effect_noise((1240, 1754), 60).point(lambda v: 30 if v < 90 else 230) for _ in range(2)]
          pages[0].save("in.pdf", save_all=True, append_images=pages[1:], resolution=150)
          PY
          rust/target/release/pdfable --crop --deskew in.pdf out.pdf
          python -c "import os, pypdf; n = len(pypdf.PdfReader('out.pdf').pages); a, b = os.path.getsize('in.pdf'), os.path.getsize('out.pdf'); print(n, a, '->', b); assert n == 2 and b < a"
